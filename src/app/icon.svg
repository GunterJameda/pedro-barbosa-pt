<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c29" />
      <stop offset="100%" stop-color="#0c1421" />
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#14b8a6" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Initials PB -->
  <g filter="url(#subtleGlow)">
    <!-- 'P' -->
    <path
      d="M 19 46.5 C 19.5 39 20.2 25 21 17 C 22.5 17 28.5 16.5 31.5 18 C 34.2 19.3 35 22.5 34.5 25.5 C 33.8 28.8 30.5 31 26 31.2 C 23.5 31.3 21 31.1 20.5 31"
      fill="none"
      stroke="url(#tealGrad)"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 'B' -->
    <path
      d="M 32 46.5 C 32.5 39.5 33 26 33.5 18 C 34.8 17.5 40 17 43 18.5 C 45.2 19.6 46 22 45.5 24.5 C 44.8 27.2 42 29 38.5 29.5 C 43 29.8 47.5 32 47 37 C 46.5 41.5 42 44.5 37 44.8 C 34.5 45 32.5 45.5 31.5 46.5"
      fill="none"
      stroke="url(#tealGrad)"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <circle cx="49" cy="45" r="1.5" fill="#5eead4" />
  </g>
</svg>
