name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Vercel waits for this check before putting a deploy live.
    # Renaming it means updating Deployment Checks in the Vercel project.
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Uses the Yarn version set in package.json.
      - run: corepack enable

      - run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Check formatting
        run: yarn format:check

      - name: Type-check
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      # The end-to-end tests (yarn test:e2e) belong here in a bigger project,
      # so a browser failure blocks the deploy. In all three browsers they add
      # several minutes to every run, which is too much for a site this small,
      # so they run locally before bigger changes, and now and then against
      # the live site (yarn test:e2e:prod).
